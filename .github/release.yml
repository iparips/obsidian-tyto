# Groups the notes GitHub generates for a release, which is what
# `gh release create --generate-notes` and the Draft button both call.
# Without this every merged PR lands in one flat list.
changelog:
  exclude:
    labels:
      - ignore-for-release
  categories:
    - title: 🚀 Features
      labels:
        - feature
        - enhancement
    - title: 🐛 Bug Fixes
      labels:
        - bug
        - fix
    - title: 📝 Documentation
      labels:
        - documentation
        - docs
    - title: 🧹 Maintenance
      labels:
        - maintenance
        - chore
        - dependencies
    - title: Other Changes
      labels:
        - '*'
